name: test
on:
  push:
  pull_request:
jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0
      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI
